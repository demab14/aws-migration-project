---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Upgrade all packages
  apt:
    upgrade: dist

- name: Install base utilities
  apt:
    name:
      - unzip
      - curl
      - software-properties-common
      - ca-certificates
    state: present

- name: Set timezone
  timezone:
    name: UTC
